# M3 benign-update runs (data-v1.2): each task's skill gets its benign versions as updates, then the
# agent runs the task. Measures what each policy costs on harmless updates (asks, denials, task success).
# Size: 55 tasks x 6 policies x 3 repeats = 990 episodes, ~500 agent runs, ~$20.
name: benign_tinker
kind: benign_updates
repos: [all]
tasks: all
policies: [none, pin_reapprove, new_permissions_only, capability_diff, deny_by_default_manifest, delegation_envelope]
models: [qwen3.8-27b-tinker]
invocations: [natural]
repeats: 3
harness_options: {isolation: netns, observer: strace, run_timeout: 1200, setup: d9}
