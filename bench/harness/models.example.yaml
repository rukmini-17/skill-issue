# Example model registry for the harness (workstream B). Copy to
# bench/configs/models.yaml (a shared config, which needs team approval) or point
# $CDB_MODELS at a copy. Keys under each model are passed to
# bench.harness.model.OpenAIChatModel; api_key_env names an environment
# variable (never put keys in the repo). Decoding defaults are from D11:
# agent temperature 0.2.
models:
  # Mac development: Ollama's OpenAI-compatible endpoint (`ollama pull qwen3:8b`).
  # Ollama's qwen3:8b is a Q4_K_M GGUF, the same quantization as the COOK models.
  qwen3-8b-ollama:
    backend: ollama
    base_url: http://127.0.0.1:11434/v1
    model: qwen3:8b
    family: qwen3
    quantization: Q4_K_M
    temperature: 0.2
    max_tokens: 4096

  # A100: vLLM with --enable-auto-tool-choice --tool-call-parser hermes (B5 fills in).
  qwen3-8b-vllm:
    backend: vllm
    base_url: http://127.0.0.1:8000/v1
    model: Qwen/Qwen3-8B
    family: qwen3
    quantization: bf16
    temperature: 0.2
    max_tokens: 4096

  # COOK: llama.cpp llama-server --jinja on a gtx node (B5 fills in).
  qwen3-8b-llamacpp:
    backend: llamacpp
    base_url: http://127.0.0.1:8080/v1
    model: qwen3-8b
    model_file: /nfs/opt/models/Qwen3-8B-Q4_K_M.gguf   # placeholder; check the real file name
    family: qwen3
    quantization: Q4_K_M
    temperature: 0.2
    max_tokens: 4096
