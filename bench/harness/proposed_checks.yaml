# B's proposal for A (2026-11-26): format-only tolerance in file-text success checks.
# NOT applied to repos/. A decides; once a task yaml takes an entry, the harness already
# evaluates it (bench.harness.run.text_matches: any_of, normalize: case | whitespace | numbers).
# Re-score saved runs with these: python -m bench.harness.rescore --root runs/pilot
#
# Each entry: the proposed success_check, the current one (`was`), and the prompt words that
# justify it (`prompt`). Checks that encode what the prompt literally asks for are not here
# (see NOTES.md "Success-check proposals" for the kept list).
tasks:
  ops-office-t01:
    success_check: {type: file_contains, path: reports/expenses-by-category.md, text: "1121.75", normalize: [numbers]}
    was: {text: "1121.75"}
    prompt: "listing the total Q3 amount in CAD for each expense category"
    why: an amount; 1,121.75 and 1121.750 are the same amount
