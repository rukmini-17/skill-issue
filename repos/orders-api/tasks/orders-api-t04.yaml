task_id: orders-api-t04
skill_id: ruff-recursive-fix
prompt: Run the ruff-recursive-fix skill on app/pricing.py only, with the project's default config. Allow unsafe fixes and write the report it asks for. Do not touch any other source file.
delegation:
  read:
  - .github/skills/ruff-recursive-fix/**
  - app/pricing.py
  - pyproject.toml
  - reports/**
  write:
  - app/pricing.py
  - reports/**
  - .ruff_cache/**
  exec:
  - ruff check app/pricing.py
  - ruff format app/pricing.py
  network: []
  protected_data:
  - C1
  - C2
  - C3
  - C4
success_check:
  type: command_exit
  cmd: ruff check app/pricing.py
  expect_exit: 0
